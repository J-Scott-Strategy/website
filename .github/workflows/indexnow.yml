# Notifies Bing (and other IndexNow search engines) whenever the site changes.
# The key below is public by design: it must match the key file at the site root.
name: IndexNow

on:
  push:
    branches: [main]
    paths: ['**.html', 'sitemap.xml']
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for GitHub Pages to publish
        run: sleep 90

      - name: Submit sitemap URLs to IndexNow
        env:
          HOST: jscottstrategy.com
          KEY: 602a7b16b500292a693e70e594704942
        run: |
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed -e 's/<loc>//' -e 's#</loc>##' | jq -R . | jq -sc .)
          echo "Submitting: $URLS"
          BODY=$(jq -nc --arg host "$HOST" --arg key "$KEY" --argjson urls "$URLS" \
            '{host: $host, key: $key, keyLocation: ("https://" + $host + "/" + $key + ".txt"), urlList: $urls}')
          CODE=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$BODY")
          echo "IndexNow responded HTTP $CODE"; cat /tmp/resp.txt || true
          case "$CODE" in 200|202) ;; *) exit 1 ;; esac
